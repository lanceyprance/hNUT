<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNUT Lock-In</title>
<meta name="description" content="HNUT10010/20 Human Nutrition 1 vitamins practice: notes, core questions, exam-style questions and mock exams with worked answers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  // always load the newest CSS/JS (GitHub Pages caches files for 10 minutes)
  window.__v = Date.now();
  document.write('<link rel="stylesheet" href="site/style.css?v=' + window.__v + '">');
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e7490'/><text x='16' y='22' font-size='15' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>Vit</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="logo">Vit</span>
    <span class="brand-text"><b>HNUT Lock-In</b><small>Vitamins practice</small></span>
  </a>
  <nav class="tools">
    <a class="tool" id="btn-repeat" href="#/repeat" title="Repetition: keep drilling, missed questions come back">🔁 <span>Repetition</span></a>
    <button class="tool" id="btn-formulas" title="Key numbers: conversions and intakes">📄 <span>Key numbers</span></button>
    <button class="tool" id="btn-smaller" title="Smaller text" aria-label="Smaller text">A−</button>
    <button class="tool" id="btn-bigger" title="Bigger text" aria-label="Bigger text">A+</button>
    <button class="tool" id="btn-theme" title="Light / dark" aria-label="Toggle dark mode">☾</button>
  </nav>
</header>

<main id="app" class="wrap">
  <p class="loading">Loading questions…</p>
</main>

<aside id="notes" class="notes" hidden aria-label="Notes and key numbers">
  <div class="pane-top">
    <div class="seg" id="pane-tabs">
      <button data-tab="notes" class="on">Notes</button>
      <button data-tab="key-numbers.md">Key numbers</button>
      <button data-tab="vitamin-table.md">Vitamin table</button>
    </div>
    <button class="ntool" id="notes-close" aria-label="Close panel">✕</button>
  </div>
  <div class="pane-view" id="notes-view">
    <div class="notes-head">
      <b id="notes-title">Notes</b>
      <select id="notes-jump" aria-label="Jump to a section"></select>
    </div>
    <div class="notes-chips" id="notes-chips"></div>
    <div class="notes-body md" id="notes-body"></div>
  </div>
  <div class="pane-view" id="doc-view" hidden>
    <div class="notes-body md" id="doc-body"></div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
